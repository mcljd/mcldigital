name = "mcl-instant"
main = "src/index.js"
compatibility_date = "2026-04-01"

# Rate-limit counter store.
# Create with:  npx wrangler kv namespace create RATE_LIMIT
# Then paste the returned id below (and the preview_id for `wrangler dev`).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

# Secrets (do NOT commit values):
#   npx wrangler secret put ANTHROPIC_API_KEY
#
# Local dev: copy .dev.vars.example to .dev.vars and paste the key there.

[observability]
enabled = true
